[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code"
version = "0.1.0"
description = "Local AI coding partner for Ollama and external OpenAI-compatible servers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
]
tui = [
    "textual>=0.60",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "textual>=0.60",
    "textual-dev>=1.5",
]

[project.scripts]
local-code = "local_code.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
